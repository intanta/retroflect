name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (tags can be moved --> secvuln); Dependabot keeps them updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check dependencies are pinned
        run: node scripts/check-pinned.mjs

      # Fails if package.json and package-lock.json disagree. No lifecycle scripts run (.npmrc).
      - name: Install
        run: npm ci

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit (high/critical, with accepted-risk allowlist)
        run: npm run audit:check

      - name: Build
        run: npm run build
